# Publishes to PyPI when a GitHub release is published (Trusted Publishing, no API token).
# One-time setup on pypi.org: Account -> Publishing -> Add a pending publisher
#   project: restrack | owner: mrjorgeparr | repo: restrack | workflow: publish.yml | environment: pypi
name: publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
        working-directory: tests
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

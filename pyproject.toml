[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "restrack"
version = "0.1.0"
description = "Real-time machine resource tracking with psutil, a Resource Monitor-style web UI, history, alerts, and a profiler for your own (pandas) code."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mrjorgeparr" }]
dependencies = ["psutil>=5.9", "tomli>=1.1; python_version < '3.11'"]
keywords = ["psutil", "monitoring", "cpu", "memory", "resource-monitor", "resmon", "profiler", "pandas",
            "cache", "page-cache", "perf", "dtype", "memory-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/mrjorgeparr/restrack"
Documentation = "https://mrjorgeparr.github.io/restrack/"
Source = "https://github.com/mrjorgeparr/restrack"
Issues = "https://github.com/mrjorgeparr/restrack/issues"

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12"]
pandas = ["pandas>=2.0"]
test = ["pytest>=7", "pandas>=2.0"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9,<10"]

[project.scripts]
restrack = "restrack.cli:main"

[tool.setuptools]
packages = ["restrack", "restrack.web", "restrack.web.static"]

[tool.setuptools.package-data]
"restrack.web.static" = ["*.html", "*.js", "*.css", "*.svg"]
